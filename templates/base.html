<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% set ftitle = full_title if full_title else title ~ " — " ~ site_name %}
  <title>{{ ftitle }}</title>
  {% if description %}<meta name="description" content="{{ description }}">{% endif %}
  {% if page_url %}<link rel="canonical" href="{{ page_url }}">{% endif %}
  <meta property="og:title" content="{{ ftitle }}">
  {% if description %}<meta property="og:description" content="{{ description }}">{% endif %}
  <meta property="og:type" content="{{ og_type or 'website' }}">
  {% if page_url %}<meta property="og:url" content="{{ page_url }}">{% endif %}
  <meta property="og:image" content="https://jackverrill.com/about-photo.jpg?v={{ photo_version }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ ftitle }}">
  {% if description %}<meta name="twitter:description" content="{{ description }}">{% endif %}
  {% if json_ld %}<script type="application/ld+json">{{ json_ld }}</script>{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}style.css?v={{ asset_version }}">
</head>
<body>
{{ content }}
</body>
</html>
